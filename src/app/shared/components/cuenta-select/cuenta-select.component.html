<mat-form-field class="blue-input flex-1" subscriptSizing="dynamic">
  <mat-icon matPrefix>{{ icon }}</mat-icon>
  <mat-label>{{ label }}</mat-label>
  <input
    matInput
    [placeholder]="'Buscar ' + label.toLowerCase() + '...'"
    [ngModel]="searchText"
    (ngModelChange)="onSearchChange($event)"
    [matAutocomplete]="auto"
    [disabled]="isDisabled"
    [required]="required"
    (blur)="onBlur()"
    autocomplete="off"
  />
  <mat-autocomplete
    #auto="matAutocomplete"
    (optionSelected)="onSelection($event.option.value)"
  >
    <mat-option [value]="null" *ngIf="!required" (onSelectionChange)="onSelection(null)">— Sin cuenta —</mat-option>
    <mat-option *ngFor="let c of filtered" [value]="c">
      ({{ c.codigo }}) {{ c.nombre }}
    </mat-option>
    <mat-option *ngIf="searchText && filtered.length === 0" disabled>
      Sin resultados para "{{ searchText }}"
    </mat-option>
    <mat-option *ngIf="!searchText && filtered.length === 0" disabled>
      Escribe para buscar cuenta...
    </mat-option>
  </mat-autocomplete>
</mat-form-field>
