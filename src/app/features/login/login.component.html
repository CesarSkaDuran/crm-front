<div class="min-h-screen flex items-center justify-center p-4" style="background-color: var(--countable-sidebar);">
  <form [formGroup]="form" (ngSubmit)="onSubmit()"
        class="w-full max-w-sm rounded-2xl shadow-2xl p-8"
        style="background-color: var(--countable-surface-dark); border: 1px solid rgba(255,255,255,0.06);">

    <div class="flex flex-col items-center mb-7">
      <img src="assets/countable-logo-full.jpeg" alt="Countable" class="login-logo mb-2" />
      <p class="text-xs mt-1" style="color: var(--countable-cyan);">Panel multiempresa</p>
    </div>

    <div class="mb-4">
      <label class="block text-[11px] font-medium mb-1.5" style="color: rgba(255,255,255,0.55);">Código de empresa</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: rgba(255,255,255,0.4);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0H5m4-4h6m-6-4h6m-6-4h6" />
          </svg>
        </span>
        <input formControlName="codigo_empresa" type="text" placeholder="DEMO"
               class="w-full rounded-lg pl-9 pr-3 py-2.5 text-sm placeholder-gray-600 focus:outline-none transition login-input" />
      </div>
    </div>

    <div class="mb-4">
      <label class="block text-[11px] font-medium mb-1.5" style="color: rgba(255,255,255,0.55);">Correo electrónico</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: rgba(255,255,255,0.4);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </span>
        <input formControlName="email" type="email" placeholder="admin@demo.com"
               class="w-full rounded-lg pl-9 pr-3 py-2.5 text-sm placeholder-gray-600 focus:outline-none transition login-input" />
      </div>
    </div>

    <div class="mb-6">
      <label class="block text-[11px] font-medium mb-1.5" style="color: rgba(255,255,255,0.55);">Contraseña</label>
      <div class="relative">
        <span class="absolute left-3 top-1/2 -translate-y-1/2" style="color: rgba(255,255,255,0.4);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </span>
        <input formControlName="password" [type]="showPassword ? 'text' : 'password'" placeholder="••••••••"
               class="w-full rounded-lg pl-9 pr-10 py-2.5 text-sm placeholder-gray-600 focus:outline-none transition login-input" />
        <button type="button" (click)="showPassword = !showPassword"
                class="absolute right-3 top-1/2 -translate-y-1/2 transition"
                style="color: rgba(255,255,255,0.4);">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            <path stroke-linecap="round" stroke-linejoin="round"
                  d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
          </svg>
        </button>
      </div>
    </div>

    <button type="submit" [disabled]="loading"
            class="login-submit w-full flex items-center justify-center gap-2 text-white text-sm font-medium py-2.5 rounded-lg transition disabled:opacity-50 disabled:cursor-not-allowed">
      @if (loading) {
        <svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
          <path class="opacity-75" fill="currentColor"
                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z" />
        </svg>
        Ingresando...
      } @else {
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        Ingresar
      }
    </button>

    @if (error) {
      <div class="mt-4 flex items-start gap-2 rounded-lg px-3 py-2" style="background-color: rgba(244,67,54,0.1); border: 1px solid rgba(244,67,54,0.2);">
        <svg class="w-4 h-4 text-red-400 shrink-0 mt-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-xs text-red-300">{{ error }}</p>
      </div>
    } @else {
      <div class="mt-5 flex items-center gap-2 rounded-lg px-3 py-2" style="background-color: rgba(56,138,243,0.08); border: 1px solid rgba(56,138,243,0.15);">
        <svg class="w-3.5 h-3.5 shrink-0" style="color: var(--countable-cyan);" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        <p class="text-[11px]" style="color: rgba(49,184,252,0.7);">Prueba: DEMO / admin&#64;demo.com / admin123</p>
      </div>
    }
  </form>
</div>
