<div class="categorias-header mb-6">
  <h1 class="page-title">Categorías</h1>
  <p class="text-gray-500 mt-1">Categorías de productos y servicios</p>
</div>

<mat-card class="p-4 mb-6">
  <h2 class="section-title mb-4">
    {{ editandoId ? 'Editar' : 'Nueva' }} categoría
  </h2>

  <form [formGroup]="form" (ngSubmit)="guardar()" class="form-row items-end">
    <mat-form-field class="blue-input flex-1" subscriptSizing="dynamic">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nombre" required />
    </mat-form-field>

    <mat-form-field class="blue-input flex-1" subscriptSizing="dynamic">
      <mat-label>Tipo</mat-label>
      <mat-select formControlName="tipo" required>
        <mat-option *ngFor="let t of tipos" [value]="t.id">{{ t.nombre }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field class="blue-input flex-1" subscriptSizing="dynamic">
      <mat-label>Descripción</mat-label>
      <input matInput formControlName="descripcion" />
    </mat-form-field>

    <button type="submit" mat-raised-button color="primary">
      <mat-icon>save</mat-icon>
      {{ editandoId ? 'Actualizar' : 'Guardar' }}
    </button>
    <button *ngIf="editandoId" type="button" mat-stroked-button color="warn" (click)="cancelar()">
      <mat-icon>close</mat-icon>
      Cancelar
    </button>
  </form>
</mat-card>

<mat-card class="p-4">
  <h2 class="section-title mb-4">Categorías registradas</h2>

  <table mat-table [dataSource]="lista" class="w-full">
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <ng-container matColumnDef="tipo">
      <th mat-header-cell *matHeaderCellDef>Tipo</th>
      <td mat-cell *matCellDef="let row">{{ nombreTipo(row.tipo) }}</td>
    </ng-container>

    <ng-container matColumnDef="descripcion">
      <th mat-header-cell *matHeaderCellDef>Descripción</th>
      <td mat-cell *matCellDef="let row">{{ row.descripcion }}</td>
    </ng-container>

    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button mat-icon-button color="primary" (click)="editar(row)">
          <mat-icon>edit</mat-icon>
        </button>
        <button mat-icon-button color="warn" (click)="eliminar(row)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="lista.length === 0" class="p-8 text-center text-gray-500">
    No hay categorías registradas
  </div>
</mat-card>
